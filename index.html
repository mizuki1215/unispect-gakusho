<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学生証確認 | Unispect</title>
<style>
:root{
  color-scheme: light dark;
  --label:#0b1a2b;
  --label-secondary:rgba(11,26,43,.62);
  --label-tertiary:rgba(11,26,43,.34);
  --bg:#eef5ff;
  --accent:#0a7cff;
  --accent-deep:#0559c9;
  --accent-on:#ffffff;
  --accent-soft:rgba(10,124,255,.10);
  --ok:#0a9b57; --ok-soft:rgba(10,155,87,.12);
  --warn:#b4780a; --warn-soft:rgba(180,120,10,.14);
  --ng:#d2453f;  --ng-soft:rgba(210,69,63,.12);
  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.76);
  --glass-edge:rgba(255,255,255,.85);
  --glass-shadow:0 18px 48px -18px rgba(6,50,120,.34);
  --hairline:rgba(11,26,43,.10);
  --fill:rgba(10,124,255,.07);
  --radius-xl:26px; --radius-lg:18px; --radius-md:13px; --pad-card:20px;
  --s3:.75rem; --s4:1rem; --s5:1.5rem;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --t-title:700 1.5rem/1.28 var(--font);
  --t-head:600 1.0625rem/1.32 var(--font);
  --t-body:400 1rem/1.6 var(--font);
  --t-sub:400 .875rem/1.55 var(--font);
  --t-cap:500 .75rem/1.4 var(--font);
  --ease:cubic-bezier(.32,.72,0,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --dur:.58s;
}
@media (prefers-color-scheme: dark){
  :root{
    --label:#f2f7ff;
    --label-secondary:rgba(226,238,255,.66);
    --label-tertiary:rgba(226,238,255,.34);
    --bg:#050c1a;
    --accent:#4aa3ff; --accent-deep:#7cc0ff; --accent-on:#04182f;
    --accent-soft:rgba(74,163,255,.16);
    --ok:#4ad991; --ok-soft:rgba(74,217,145,.16);
    --warn:#ffca55; --warn-soft:rgba(255,202,85,.16);
    --ng:#ff7b74; --ng-soft:rgba(255,123,116,.16);
    --glass:rgba(255,255,255,.07);
    --glass-strong:rgba(255,255,255,.12);
    --glass-edge:rgba(255,255,255,.16);
    --glass-shadow:0 18px 48px -18px rgba(0,0,0,.7);
    --hairline:rgba(255,255,255,.10);
    --fill:rgba(255,255,255,.07);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--label);font:var(--t-body);letter-spacing:.01em;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(70px);opacity:.62;will-change:transform}
.aurora i:nth-child(1){width:64vmax;height:64vmax;left:-24vmax;top:-30vmax;background:radial-gradient(circle at 30% 30%,#7ec8ff,rgba(126,200,255,0) 70%);animation:drift1 34s var(--ease) infinite alternate}
.aurora i:nth-child(2){width:52vmax;height:52vmax;right:-20vmax;top:6vmax;background:radial-gradient(circle at 60% 40%,#b9e0ff,rgba(185,224,255,0) 70%);animation:drift2 42s var(--ease) infinite alternate}
.aurora i:nth-child(3){width:58vmax;height:58vmax;left:-14vmax;bottom:-30vmax;background:radial-gradient(circle at 50% 50%,#5aa9ff,rgba(90,169,255,0) 70%);animation:drift3 38s var(--ease) infinite alternate}
@media (prefers-color-scheme: dark){.aurora i{opacity:.38;filter:blur(90px)}}
@keyframes drift1{to{transform:translate3d(12vmax,10vmax,0) scale(1.15)}}
@keyframes drift2{to{transform:translate3d(-14vmax,14vmax,0) scale(1.1)}}
@keyframes drift3{to{transform:translate3d(16vmax,-12vmax,0) scale(1.18)}}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:22px 16px 72px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{width:46px;height:46px;border-radius:14px;flex:0 0 auto;object-fit:contain;padding:8px;background:#fff;box-shadow:0 8px 22px -8px rgba(6,50,120,.45),inset 0 0 0 .5px rgba(11,26,43,.08)}
.top h1{font:var(--t-title);margin:0;letter-spacing:.005em}
.top p{font:var(--t-cap);color:var(--label-secondary);margin:2px 0 0;letter-spacing:.06em}
.steps{display:flex;gap:6px;margin:0 0 20px}
.steps span{flex:1;height:4px;border-radius:99px;background:var(--fill);overflow:hidden;position:relative}
.steps span::after{content:"";position:absolute;inset:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-deep));transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.steps span.on::after{transform:scaleX(1)}
.card{position:relative;background:var(--glass);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border-radius:var(--radius-xl);padding:var(--pad-card);margin-bottom:16px;box-shadow:var(--glass-shadow),inset 0 0 0 .5px var(--glass-edge);overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:52%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));pointer-events:none}
@media (prefers-color-scheme: dark){.card::before{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0))}}
.card > *{position:relative}
.card h2{font:var(--t-head);margin:0 0 var(--s4);padding-bottom:var(--s3);border-bottom:.5px solid var(--hairline);letter-spacing:.02em}
.pane{animation:paneIn var(--dur) var(--ease-out) both}
@keyframes paneIn{from{opacity:0;transform:translate3d(0,14px,0) scale(.985)}to{opacity:1;transform:none}}
.hide{display:none}
label.f{display:block;font:var(--t-cap);color:var(--label-secondary);margin:var(--s4) 0 6px;letter-spacing:.04em}
label.f b{color:var(--ng);font-weight:600;margin-left:5px}
input[type=text],input[type=date],input[type=tel],input[type=email]{width:100%;min-height:46px;padding:12px 14px;border:.5px solid var(--hairline);border-radius:var(--radius-md);background:var(--glass-strong);color:var(--label);font:400 1rem/1.4 var(--font);transition:border-color .28s var(--ease),box-shadow .28s var(--ease),background .28s var(--ease)}
input::placeholder{color:var(--label-tertiary)}
input:focus{outline:none;border-color:transparent;box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1.5px var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.chip{min-height:38px;display:inline-flex;align-items:center;padding:8px 15px;border-radius:99px;cursor:pointer;user-select:none;background:var(--glass-strong);border:.5px solid var(--hairline);font:500 .875rem/1 var(--font);color:var(--label);transition:transform .22s var(--ease),background .28s var(--ease),color .2s var(--ease),box-shadow .28s var(--ease),border-color .2s var(--ease)}
.chip:active{transform:scale(.955)}
.chip.on{background:linear-gradient(140deg,var(--accent),var(--accent-deep));border-color:transparent;color:var(--accent-on);box-shadow:0 8px 20px -8px rgba(10,124,255,.75)}
.hint{font:var(--t-sub);color:var(--label-secondary);margin-top:8px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:var(--s5);border:0;border-radius:var(--radius-lg);cursor:pointer;background:linear-gradient(140deg,var(--accent),var(--accent-deep));color:var(--accent-on);font:600 1rem/1 var(--font);letter-spacing:.03em;box-shadow:0 12px 26px -12px rgba(10,124,255,.9),inset 0 .5px 0 rgba(255,255,255,.45);transition:transform .24s var(--ease),box-shadow .3s var(--ease),opacity .2s linear}
.btn:active{transform:scale(.978)}
.btn:disabled{opacity:.55;box-shadow:none;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--glass-strong);color:var(--label);border:.5px solid var(--hairline);font-weight:500;box-shadow:none;margin-top:10px}
.btn:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.btn::after{content:"";position:absolute;inset:0;background:radial-gradient(120px 60px at var(--mx,50%) var(--my,50%),rgba(255,255,255,.34),transparent 70%);opacity:0;transition:opacity .5s var(--ease);pointer-events:none}
.btn:active::after{opacity:1;transition-duration:.05s}
.shot{position:relative;margin-top:14px;border-radius:var(--radius-lg);overflow:hidden;box-shadow:inset 0 0 0 .5px var(--hairline);display:none;animation:shotIn .6s var(--ease-out) both}
@keyframes shotIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.shot img{display:block;width:100%}
.scan{position:absolute;inset:0;display:none;pointer-events:none}
.scan.on{display:block}
.scan::before{content:"";position:absolute;left:0;right:0;height:34%;background:linear-gradient(180deg,rgba(10,124,255,0),rgba(120,200,255,.55),rgba(10,124,255,0));animation:sweep 1.5s var(--ease) infinite}
@keyframes sweep{0%{top:-34%}100%{top:100%}}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:.5px solid var(--hairline);font:var(--t-body)}
.row:last-of-type{border-bottom:0}
.tag{font:700 .75rem/1 var(--font);padding:7px 12px;border-radius:99px;letter-spacing:.06em;white-space:nowrap}
.tag.pop{animation:pop .5s var(--ease-out) both}
@keyframes pop{0%{opacity:0;transform:scale(.72)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ng{background:var(--ng-soft);color:var(--ng)}
.tag.idle{background:var(--fill);color:var(--label-tertiary)}
.ocr{margin-top:10px;padding:12px;border-radius:var(--radius-md);background:var(--fill);color:var(--label-secondary);font:400 .75rem/1.6 var(--font);white-space:pre-wrap;max-height:124px;overflow:auto}
.agree{display:flex;gap:11px;align-items:flex-start;margin-top:var(--s4);font:var(--t-sub)}
.agree input{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:23px;height:23px;margin:2px 0 0;border-radius:8px;cursor:pointer;border:1.5px solid var(--label-tertiary);background:var(--glass-strong);transition:background .26s var(--ease),border-color .26s var(--ease),transform .2s var(--ease);position:relative}
.agree input:checked{background:linear-gradient(140deg,var(--accent),var(--accent-deep));border-color:transparent}
.agree input:checked::after{content:"";position:absolute;left:7.5px;top:3.5px;width:5px;height:10px;border:solid var(--accent-on);border-width:0 2px 2px 0;transform:rotate(45deg)}
.agree input:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.agree a{color:var(--accent);text-underline-offset:3px}
.err{color:var(--ng);font:var(--t-sub);margin-top:10px;display:none;animation:shake .4s var(--ease)}
@keyframes shake{10%,90%{transform:translateX(-1.5px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-3px)}}
.done{text-align:center;padding:36px 8px 24px}
.done svg{width:66px;height:66px;margin-bottom:16px}
.done circle{stroke-dasharray:170;stroke-dashoffset:170;animation:draw .7s var(--ease-out) .1s forwards}
.done path{stroke-dasharray:44;stroke-dashoffset:44;animation:draw .45s var(--ease-out) .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{border:0;padding:0;font:var(--t-title);margin:0 0 10px}
.done p{font:var(--t-sub);color:var(--label-secondary);margin:0}
.foot{font:var(--t-cap);color:var(--label-tertiary);text-align:center;margin-top:26px;line-height:1.9}
.spin{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
@media (prefers-reduced-transparency: reduce){.card{background:var(--glass-strong);backdrop-filter:none;-webkit-backdrop-filter:none}.aurora{display:none}}
</style>
</head>

    <div><h1>学生証確認</h1><p>UNISPECT</p></div>
  </header>
  <div class="steps"><span id="s1" class="on"></span><span id="s2"></span><span id="s3"></span></div>

  <section class="card pane" id="step1">
    <h2>基本情報</h2>
    <label class="f">氏名（漢字フルネーム）<b>必須</b></label>
    <input type="text" id="name" placeholder="山田 太郎" autocomplete="name">
    <label class="f">生年月日<b>必須</b></label>
    <input type="date" id="dob" autocomplete="bday">
    <label class="f">卒業予定年度（西暦）<b>必須</b></label>
    <input type="text" id="gradYear" inputmode="numeric" placeholder="2028">
    <label class="f">該当するものをすべて選択<b>必須</b></label>
    <div class="chips" id="statusChips"></div>
    <label class="f">電話番号<b>必須</b></label>
    <input type="tel" id="phone" placeholder="09012345678" autocomplete="tel">
    <label class="f">メールアドレス<b>必須</b></label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <p class="hint" id="refNote"></p>
    <p class="err" id="err1"></p>
    <button class="btn" id="toStep2">次へ　証明書類の確認</button>
  </section>

  <section class="card pane hide" id="step2">
    <h2>証明書類</h2>
    <label class="f">提出する書類の種類</label>
    <div class="chips" id="docChips"></div>
    <p class="hint" id="docHint"></p>
    <input type="file" id="file" accept="image/*" capture="environment" class="hide">
    <button class="btn ghost" id="pick" style="margin-top:16px">写真を選ぶ / 撮影する</button>
    <div class="shot" id="shot"><img id="preview" alt=""><div class="scan" id="scan"></div></div>
    <button class="btn hide" id="ocr">この写真を読み取る</button>
    <p class="err" id="err2"></p>
    <button class="btn ghost" id="back1">戻る</button>
  </section>

  <section class="card pane hide" id="step3">
    <h2>読み取り結果</h2>
    <div class="row"><span>卒業予定年度</span><span class="tag idle" id="jGrad">未判定</span></div>
    <div class="row"><span>生年月日</span><span class="tag idle" id="jDob">未判定</span></div>
    <p class="hint" style="margin-top:14px">読み取った文字（確認用）</p>
    <div class="ocr" id="ocrText">-</div>
    <label class="agree"><input type="checkbox" id="ag1"><span><a id="termsLink" href="#" target="_blank" rel="noopener">利用規約</a>に同意します</span></label>
    <label class="agree"><input type="checkbox" id="ag2"><span><a id="privacyLink" href="#" target="_blank" rel="noopener">個人情報の取り扱い</a>に同意し、入力情報および提出書類の確認結果を、Unispectおよび協力企業・送客先企業に提供することに同意します。</span></label>
    <p class="err" id="err3"></p>
    <button class="btn" id="submit">この内容で登録を送信する</button>
    <button class="btn ghost" id="back2">写真を撮り直す</button>
  </section>

  <section class="card pane hide" id="done">
    <div class="done">
      <svg viewBox="0 0 66 66" fill="none" aria-hidden="true">
        <circle cx="33" cy="33" r="27" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/>

  </section>

  var PRIVACY = 'https://docs.google.com/document/d/1Jcvu6QG9CwwvUtkkAw8Y2Brp-D7stbPKghKmThSJLdI/view';
  var REF = (new URLSearchParams(location.search).get('ref') || '20');

  var STATUSES = ['ストレート学生','浪人','留年','留学','休学','院生','既卒','社会人'];
  var DOCS = [
    {id:'id', label:'学生証', hint:'書類をまっすぐ・平らにして、明るい場所で光の反射が入らないように撮影してください。有効期限の欄が写るとより正確に判定できます。'},
    {id:'mypage', label:'大学マイページ', hint:'氏名・学籍番号・卒業予定年度が読み取れる画面を撮影またはスクリーンショットしてください。'}
  ];
  var state = { status: [], docType: 'id', hi: '', lo: '', ocr: '', years: [], best: '' };

  function $(id){ return document.getElementById(id); }
  function show(id){ var e=$(id); e.classList.remove('hide'); e.classList.remove('pane'); void e.offsetWidth; e.classList.add('pane'); }
  function hide(id){ $(id).classList.add('hide'); }
  function setStep(n){ ['s1','s2','s3'].forEach(function(s,i){ $(s).className = (i < n ? 'on' : ''); }); }
  function fail(id,msg){ var e=$(id); e.textContent=msg; e.style.display = msg ? 'block' : 'none'; }
  function go(from,to,step){ hide(from); show(to); setStep(step); window.scrollTo({top:0,behavior:'smooth'}); }

  $('refNote').textContent = REF ? ('紹介者ID ' + REF + '　リンクから自動入力されました') : '';
  $('termsLink').href = TERMS;
  $('privacyLink').href = PRIVACY;

  STATUSES.forEach(function(s){
    var b=document.createElement('div');
    b.className='chip'; b.textContent=s; b.setAttribute('role','button'); b.tabIndex=0;
    b.onclick=function(){
      var i=state.status.indexOf(s);
      if(i>=0){ state.status.splice(i,1); b.classList.remove('on'); }
      else { state.status.push(s); b.classList.add('on'); }
    };
    b.onkeydown=function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); b.click(); } };
    $('statusChips').appendChild(b);
  });

  DOCS.forEach(function(d){
    var b=document.createElement('div');
    b.className='chip'+(d.id==='id'?' on':''); b.textContent=d.label; b.setAttribute('role','button'); b.tabIndex=0;
    b.onclick=function(){
      state.docType=d.id;
      [].forEach.call($('docChips').children,function(c){ c.classList.remove('on'); });
      b.classList.add('on');
      $('docHint').textContent=d.hint;
    };
    b.onkeydown=function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); b.click(); } };
    $('docChips').appendChild(b);
  });
  $('docHint').textContent = DOCS[0].hint;

  [].forEach.call(document.querySelectorAll('.btn'), function(b){
    b.addEventListener('pointerdown', function(e){
      var r=b.getBoundingClientRect();
      b.style.setProperty('--mx',(e.clientX-r.left)+'px');
      b.style.setProperty('--my',(e.clientY-r.top)+'px');
    });
  });

  $('toStep2').onclick=function(){
    var name=$('name').value.trim(), dob=$('dob').value, gy=$('gradYear').value.trim();
    var phone=$('phone').value.trim(), email=$('email').value.trim();
    if(!name||!dob||!gy||!phone||!email){ fail('err1','未入力の項目があります。'); return; }
    if(!/^20\d\d$/.test(gy)){ fail('err1','卒業予定年度は西暦4桁で入力してください。'); return; }
    if(!state.status.length){ fail('err1','該当するものを1つ以上選択してください。'); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ fail('err1','メールアドレスの形式が正しくありません。'); return; }
    fail('err1',''); go('step1','step2',2);
  };
  $('back1').onclick=function(){ go('step2','step1',1); };
  $('back2').onclick=function(){ go('step3','step2',2); };

  $('pick').onclick=function(){ $('file').click(); };
  $('file').onchange=function(ev){
    var f=ev.target.files && ev.target.files[0];
    if(!f) return;
    fail('err2','');
    var reader=new FileReader();
    reader.onload=function(){
      resize(reader.result,1600,function(hi){
        resize(reader.result,800,function(lo){
          state.hi=hi; state.lo=lo;
          $('preview').src=hi;
          $('shot').style.display='block';
          $('ocr').classList.remove('hide');
          $('pick').textContent='写真を撮り直す';
        });
      });
    };
    reader.readAsDataURL(f);
  };

  function resize(dataUrl,max,cb){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height,r=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');
      c.width=Math.round(w*r); c.height=Math.round(h*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',.8));
    };
    img.src=dataUrl;
  }

  $('ocr').onclick=function(){
    var btn=$('ocr');
    btn.disabled=true;
    btn.innerHTML='<span class="spin"></span>読み取り中…';
    $('scan').classList.add('on');
    Tesseract.recognize(state.hi,'jpn+eng')
      .then(function(res){ state.ocr=(res&&res.data&&res.data.text)?res.data.text:''; })
      .catch(function(){ state.ocr=''; })
      .then(function(){
        $('scan').classList.remove('on');
        judge();
        go('step2','step3',3);
        btn.disabled=false; btn.textContent='この写真を読み取る';
      });
  };

  function judge(){
    var text=state.ocr.replace(/\s+/g,' ');
    $('ocrText').textContent = text || '（文字を読み取れませんでした）';
    var years=(text.match(/20\d\d/g)||[]);
    (text.match(/令和\s*\d{1,2}/g)||[]).forEach(function(m){ years.push(String(2018+parseInt(m.replace(/\D/g,''),10))); });
    (text.match(/平成\s*\d{1,2}/g)||[]).forEach(function(m){ years.push(String(1988+parseInt(m.replace(/\D/g,''),10))); });
    state.years=years; state.best=years.length?years[years.length-1]:'';
    var gy=$('gradYear').value.trim(), gj;
    if(!years.length) gj=['warn','要確認'];
    else if(years.indexOf(gy)>=0||years.indexOf(String(parseInt(gy,10)+1))>=0) gj=['ok','一致'];
    else gj=['ng','不一致'];
    $('jGrad').className='tag pop '+gj[0]; $('jGrad').textContent=gj[1]; state.gradJudge=gj[1];
    var dob=$('dob').value, dj=['warn','要確認'];
    if(dob){
      var p=dob.split('-'), y=p[0], m2=String(parseInt(p[1],10)), d2=String(parseInt(p[2],10));
      if(new RegExp(y+'\\D{0,3}0?'+m2+'\\D{0,3}0?'+d2).test(text)) dj=['ok','一致'];
    }
    $('jDob').className='tag pop '+dj[0]; $('jDob').textContent=dj[1]; state.dobJudge=dj[1];
  }

  $('submit').onclick=function(){
    if(!$('ag1').checked||!$('ag2').checked){ fail('err3','2つの同意にチェックしてください。'); return; }
    fail('err3','');
    var btn=$('submit');
    btn.disabled=true;
    btn.innerHTML='<span class="spin"></span>送信中…';
    var payload={
      ref:REF, name:$('name').value.trim(), dob:$('dob').value,
      gradYear:$('gradYear').value.trim(), status:state.status,
      phone:$('phone').value.trim(), email:$('email').value.trim(),
      docType:state.docType, imgDataUrlHi:state.hi, imgDataUrlLo:state.lo,
      ocrText:state.ocr, bestGuess:state.best, allYears:state.years,
      gradJudge:state.gradJudge, dobJudge:state.dobJudge
    };
    fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) })
      .then(function(res){ return res.json().catch(function(){ return {ok:true}; }); })
      .then(function(r){
        if(r && r.ok !== false){ go('step3','done',3); }
        else { throw new Error('ng'); }
      })
      .catch(function(){
        fail('err3','送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。');
        btn.disabled=false; btn.textContent='この内容で登録を送信する';
      });
  };
</script>
</body>
</html>
